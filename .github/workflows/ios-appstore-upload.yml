name: iOS App Store Upload (macos-26 )

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      build_number:
        description: 'Build number (e.g. 13)'
        required: true
        default: '13'
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      # ── 0. Setup PATH ──────────────────────────────────────────────────────
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Setup pnpm ──────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── 4. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 4b. Cache pnpm store (self-hosted runner) ──────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        env:
          NODE_ENV: production
          VITE_APP_TITLE: "Durak online from KZ"
          VITE_ADMOB_IOS_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        run: pnpm run build

      # ── 7. Install Capacitor CLI ───────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@8

      # ── 8. Add iOS platform ────────────────────────────────────────────────
      - name: Add iOS platform
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "No xcodeproj found, running cap add ios..."
            cp -r ios/App/App/Assets.xcassets /tmp/AppAssets || true
            cp -r ios/App/App/*.lproj /tmp/ 2>/dev/null || true
            cp ios/App/App/Info.plist /tmp/Info.plist || true
            cp ios/App/App/GoogleService-Info.plist /tmp/GoogleService-Info.plist 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            cp -r /tmp/AppAssets ios/App/App/Assets.xcassets || true
            for dir in /tmp/*.lproj; do
              [ -d "$dir" ] && cp -r "$dir" "ios/App/App/" || true
            done
            cp /tmp/Info.plist ios/App/App/Info.plist || true
            cp /tmp/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist 2>/dev/null || true
          fi
          npx cap sync ios

      # ── 8b. Set version and build number ─────────────────────────────────────
      - name: Set version and build number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version ${{ github.event.inputs.version }}
          xcrun agvtool new-version -all ${{ github.event.inputs.build_number }}

      # ── 9. Ensure CocoaPods is available ───────────────────────────────────
      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod &>/dev/null; then
            brew link --overwrite cocoapods 2>/dev/null || brew install cocoapods
          fi
          pod --version

      # ── 10. Ensure Fastlane is available ───────────────────────────────────
      - name: Ensure Fastlane is available
        run: |
          if ! command -v fastlane &>/dev/null; then
            brew link --overwrite fastlane 2>/dev/null || brew install fastlane
          fi
          fastlane --version

      # ── 11. Install CocoaPods dependencies ─────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          # Create Podfile if missing (cap sync doesn't always create it)
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Creating Podfile from base64..."
            echo "" | base64 --decode > ios/App/Podfile
            echo "Podfile created."
          fi

          # Run cap sync to populate Podfile with all plugins
          npx cap sync ios --no-build 2>&1 || npx cap sync ios 2>&1 || true

          cd ios/App
          pod install --no-repo-update 2>&1 || pod install 2>&1

          echo "=== Podfile.lock - Capacitor versions ==="
          grep -A2 'Capacitor\|CapacitorSplashScreen\|CapacitorPushNotifications' Podfile.lock 2>/dev/null | head -30 || echo "No Podfile.lock found"

      # ── 12. Patch capacitor plugin sources for capacitor-swift-pm 8.1.0 ──────
      # capacitor-swift-pm 8.1.0 is a binary XCFramework that lacks several APIs
      # present in @capacitor/ios 8.1.0 (CocoaPods). We patch the plugin Swift
      # source files in node_modules directly before Xcode compiles them.
      - name: Patch capacitor plugin sources for capacitor-swift-pm 8.1.0 compatibility
        run: python3 .github/scripts/patch_capacitor_plugins.py

      # ── 13. Import Distribution Certificate ───────────────────────────────
      - name: Import Distribution Certificate
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain"
          KEYCHAIN_PASSWORD="temp_keychain_password_$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          echo "=== Identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      # ── 14. Install Provisioning Profile ──────────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "IOS_PROVISIONING_PROFILE secret is empty, skipping."
            exit 0
          fi

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          PROFILE_SIZE=$(wc -c < "$PROFILE_PATH")
          echo "Decoded profile size: $PROFILE_SIZE bytes"
          if [ "$PROFILE_SIZE" -lt 100 ]; then
            echo "Profile too small, skipping."
            exit 0
          fi

          # Extract UUID using security cms
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            python3 -c "
import sys, plistlib
try:
    p = plistlib.load(sys.stdin.buffer)
    print(p.get('UUID',''))
except:
    print('')
" 2>/dev/null)

          # Fallback: extract UUID with grep
          if [ -z "$PROFILE_UUID" ]; then
            PROFILE_UUID=$(strings "$PROFILE_PATH" | grep -E '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$' | head -1)
          fi

          if [ -z "$PROFILE_UUID" ]; then
            echo "Could not extract UUID from profile, skipping."
            exit 0
          fi

          echo "Profile UUID: $PROFILE_UUID"

          # Extract profile name
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | \
            python3 -c "
import sys, plistlib
try:
    p = plistlib.load(sys.stdin.buffer)
    print(p.get('Name',''))
except:
    print('')
" 2>/dev/null)
          echo "Profile Name: $PROFILE_NAME"

          # Install profile in both standard locations
          PP_DIR1="$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_DIR2="$HOME/Library/Developer/Xcode/UserData/ProvisioningProfiles"
          mkdir -p "$PP_DIR1" "$PP_DIR2"
          cp "$PROFILE_PATH" "$PP_DIR1/${PROFILE_UUID}.mobileprovision"
          cp "$PROFILE_PATH" "$PP_DIR2/${PROFILE_UUID}.mobileprovision"

          echo "Profile installed to:"
          echo "  $PP_DIR1/${PROFILE_UUID}.mobileprovision"
          echo "  $PP_DIR2/${PROFILE_UUID}.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
      # ── 15. Update Xcode project settings ─────────────────────────────────
      - name: Update Xcode project bundle ID and signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cd ios/App

          python3 << 'PYEOF2'
          import re, os

          pbxproj_path = "App.xcodeproj/project.pbxproj"
          bundle_id = os.environ['IOS_BUNDLE_ID']
          team_id = os.environ['IOS_TEAM_ID']

          with open(pbxproj_path, "r") as f:
              content = f.read()

          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
                           f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};', content)
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;',
                           f'DEVELOPMENT_TEAM = {team_id};', content)
          content = re.sub(r'CODE_SIGN_STYLE = [^;]+;',
                           'CODE_SIGN_STYLE = Automatic;', content)
          content = re.sub(r'CODE_SIGN_IDENTITY = [^;]*;',
                           'CODE_SIGN_IDENTITY = "";', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]*;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE = [^;]*;', '', content)

          with open(pbxproj_path, "w") as f:
              f.write(content)
          print("Xcode project updated successfully")
          PYEOF2

          find Pods -name "*.xcconfig" 2>/dev/null | while read xcconfig; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d' "$xcconfig" 2>/dev/null || true
            sed -i '' '/^PROVISIONING_PROFILE/d' "$xcconfig" 2>/dev/null || true
          done

      # ── 16. Setup App Store Connect API Key ──────────────────────────────
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          if echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | grep -q 'BEGIN'; then
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"
          else
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          fi

          echo "API key file size: $(wc -c < "$API_KEY_PATH") bytes"
          echo "API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV
          echo "API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >> $GITHUB_ENV

      # ── 17. Resolve SPM deps + inject shim ───────────────────────────────────
      - name: Resolve SPM dependencies and inject CapacitorCompatibility shim
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          echo "=== Resolving SPM package dependencies ==="
          xcodebuild -resolvePackageDependencies \
            -workspace App.xcworkspace \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            2>&1 | tail -20 || true

          echo "=== Injecting CapacitorCompatibility.swift into SourcePackages/checkouts ==="
          COMPAT_FILE="/tmp/CapacitorCompatibility.swift"
          # Decode the shim (same base64 as step 12)
          echo "" | base64 --decode > "$COMPAT_FILE"
          echo "Shim: $(wc -l < $COMPAT_FILE) lines"

          # Inject into every Sources directory in SourcePackages/checkouts
          CHECKOUTS="$RUNNER_TEMP/SourcePackages/checkouts"
          if [ -d "$CHECKOUTS" ]; then
            find "$CHECKOUTS" -path "*/ios/Sources" -type d 2>/dev/null | while read srcdir; do
              echo "Injecting into: $srcdir"
              cp "$COMPAT_FILE" "$srcdir/CapacitorCompatibility.swift"
            done
            # Also patch bridge.viewController/webView in checkouts
            find "$CHECKOUTS" -name "*.swift" 2>/dev/null | while read f; do
              if grep -q 'bridge.*viewController\|bridge.*webView' "$f" 2>/dev/null; then
                perl -i '' -pe 's/\bbridge\??\.viewController\b/self.webView?.next as? UIViewController/g' "$f" 2>/dev/null || true
                perl -i '' -pe 's/\bbridge\??\.webView\b/self.webView/g' "$f" 2>/dev/null || true
              fi
            done
            # Also patch PushNotifications in checkouts
            find "$CHECKOUTS" -name "PushNotificationsHandler.swift" 2>/dev/null | while read f; do
              perl -i '' -pe 's/self\.plugin\?\.getConfig\(\)\.getArray\("presentationOptions"\)/self.plugin?.getConfig().getConfigJSON()["presentationOptions"]/g' "$f" 2>/dev/null || true
              perl -i '' -pe 's/JSTypes\.coerceDictionaryToJSObject\([^)]+\)\s*\?\?\s*\[:\]/(request.content.userInfo as? JSObject) ?? [:]/g' "$f" 2>/dev/null || true
            done
            find "$CHECKOUTS" -name "PushNotificationsPlugin.swift" 2>/dev/null | while read f; do
              perl -i '' -pe 's/call\.getArray\("notifications",\s*JSObject\.self\)/call.getArray("notifications", []) as? [JSObject]/g' "$f" 2>/dev/null || true
            done
            echo "=== Injection into SourcePackages/checkouts complete ==="
          else
            echo "WARNING: SourcePackages/checkouts not found at $CHECKOUTS"
            ls -la "$RUNNER_TEMP/SourcePackages/" 2>/dev/null || echo "SourcePackages dir empty"
          fi

      # ── 17b. Diagnose PushNotifications source files ─────────────────────────
      - name: Diagnose PushNotifications source files
        run: |
          echo "=== PushNotificationsPlugin.swift (first 50 lines) ==="
          PUSH_DIR=$(find . -path "*push-notifications*/PushNotificationsPlugin" -type d 2>/dev/null | head -1)
          if [ -n "$PUSH_DIR" ]; then
            echo "Found at: $PUSH_DIR"
            head -50 "$PUSH_DIR/PushNotificationsPlugin.swift" 2>/dev/null || echo "File not found"
            echo "--- PushNotificationsHandler.swift ---"
            cat "$PUSH_DIR/PushNotificationsHandler.swift" 2>/dev/null || echo "File not found"
            echo "--- All .swift files in dir ---"
            ls -la "$PUSH_DIR/" 2>/dev/null
          else
            echo "PushNotifications plugin dir not found"
            find . -name "PushNotificationsPlugin.swift" 2>/dev/null | head -5
          fi
          echo "=== Capacitor 8.1.0 getArray signatures ==="
          grep -n "func getArray" node_modules/.pnpm/@capacitor+ios@8.1.0_@capacitor+core@8.1.0/node_modules/@capacitor/ios/Capacitor/Capacitor/JSTypes.swift 2>/dev/null || echo "Not found"
          echo "=== SplashScreenPlugin.swift (8.1.0) - after patch ==="
          SPLASH_FILE=$(find . -path "*@capacitor+core@8.1.0*splash-screen*SplashScreenPlugin.swift" 2>/dev/null | head -1)
          if [ -n "$SPLASH_FILE" ]; then
            echo "Found at: $SPLASH_FILE"
            cat -n "$SPLASH_FILE"
          else
            echo "SplashScreenPlugin.swift (8.1.0) not found"
            find . -name "SplashScreenPlugin.swift" 2>/dev/null
          fi

      # ── 18. Build & Archive ────────────────────────────────────────────────
      - name: Build and Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          echo "=== Build environment ==="
          echo "Team ID: $IOS_TEAM_ID"
          echo "Bundle ID: $IOS_BUNDLE_ID"
          echo "Keychain: $KEYCHAIN_PATH"

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee /tmp/xcodebuild.log

          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "========================================"
            echo "=== ARCHIVE FAILED - FIRST 30 ERRORS ==="
            echo "========================================"
            grep -m 30 ' error:' /tmp/xcodebuild.log || echo "No 'error:' lines found"
            echo ""
            echo "=== LAST 50 LINES OF BUILD LOG ==="
            tail -50 /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive created successfully!"

      # ── 18. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"

          # Generate ExportOptions.plist via external Python script (avoids heredoc YAML issues)
          python3 .github/scripts/generate_export_options.py

          echo "=== ExportOptions.plist content ==="
          cat "$RUNNER_TEMP/ExportOptions.plist"

          echo "=== Running xcodebuild -exportArchive ==="
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee /tmp/export.log || true

          echo "=== IPA directory contents ==="
          ls -la "$RUNNER_TEMP/ipa/"

          # If IPA not found, try Fastlane as fallback
          if ! find "$RUNNER_TEMP/ipa" -name "*.ipa" | grep -q .; then
            echo "=== xcodebuild export failed, trying Fastlane ==="
            cat /tmp/export.log | tail -30

            # Generate Fastfile via external Python script
            python3 .github/scripts/generate_fastfile_export.py

            cd ios/App
            fastlane export_ipa 2>&1 | tee /tmp/fastlane_export.log || true
            cd ../..

            echo "=== IPA directory after Fastlane ==="
            ls -la "$RUNNER_TEMP/ipa/"

            if ! find "$RUNNER_TEMP/ipa" -name "*.ipa" | grep -q .; then
              echo "=== FASTLANE EXPORT FAILED ==="
              cat /tmp/fastlane_export.log | tail -50
              exit 1
            fi
          fi

      # ── 19. Upload to App Store Connect ────────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found!"
            exit 1
          fi
          echo "Uploading: $IPA_PATH"

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH" 2>/dev/null || \
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1

          rm -f "$API_KEY_PATH" 2>/dev/null || true

      # ── 20. Upload IPA as artifact ─────────────────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakOnlineKZ-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 21. Cleanup ────────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
