name: iOS Build & App Store Upload

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      # ── 0. Setup PATH ──────────────────────────────────────────────────────
      - name: Setup PATH
        run: |
          if [ -f "/opt/homebrew/bin/brew" ]; then
            echo "/opt/homebrew/bin" >> $GITHUB_PATH
            echo "/opt/homebrew/sbin" >> $GITHUB_PATH
          elif [ -f "/usr/local/bin/brew" ]; then
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi
          if [ -d "$HOME/.rbenv/shims" ]; then
            echo "$HOME/.rbenv/shims" >> $GITHUB_PATH
            echo "$HOME/.rbenv/bin" >> $GITHUB_PATH
          fi
          echo "PATH setup complete"

      # ── 1. Verify Xcode ────────────────────────────────────────────────────
      - name: Verify Xcode setup
        run: |
          xcode-select -p
          xcodebuild -version

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Setup pnpm ──────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── 4. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        env:
          NODE_ENV: production
          VITE_APP_TITLE: "Durak online from KZ"
          VITE_ADMOB_IOS_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        run: pnpm run build

      # ── 7. Install Capacitor CLI ───────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@8

      # ── 8. Add iOS platform ────────────────────────────────────────────────
      - name: Add iOS platform
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "No xcodeproj found, running cap add ios..."
            cp -r ios/App/App/Assets.xcassets /tmp/AppAssets || true
            cp -r ios/App/App/*.lproj /tmp/ 2>/dev/null || true
            cp ios/App/App/Info.plist /tmp/Info.plist || true
            cp ios/App/App/GoogleService-Info.plist /tmp/GoogleService-Info.plist 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            cp -r /tmp/AppAssets ios/App/App/Assets.xcassets || true
            for dir in /tmp/*.lproj; do
              [ -d "$dir" ] && cp -r "$dir" "ios/App/App/" || true
            done
            cp /tmp/Info.plist ios/App/App/Info.plist || true
            cp /tmp/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist 2>/dev/null || true
          fi
          npx cap sync ios

      # ── 9. Ensure CocoaPods is available ───────────────────────────────────
      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod &>/dev/null; then
            brew link --overwrite cocoapods 2>/dev/null || brew install cocoapods
          fi
          pod --version

      # ── 10. Ensure Fastlane is available ───────────────────────────────────
      - name: Ensure Fastlane is available
        run: |
          if ! command -v fastlane &>/dev/null; then
            brew link --overwrite fastlane 2>/dev/null || brew install fastlane
          fi
          fastlane --version

      # ── 11. Install CocoaPods dependencies ─────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          # Create Podfile if missing (cap sync doesn't always create it)
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Creating Podfile from base64..."
            echo "" | base64 --decode > ios/App/Podfile
            echo "Podfile created."
          fi

          # Run cap sync to populate Podfile with all plugins
          npx cap sync ios --no-build 2>&1 || npx cap sync ios 2>&1 || true

          echo "=== Podfile ==="
          cat ios/App/Podfile

          cd ios/App
          pod install --no-repo-update 2>&1 || pod install 2>&1

          echo "=== Podfile.lock - Capacitor versions installed by CocoaPods ==="
          grep -A2 'Capacitor\|CapacitorApp\|CapacitorPushNotifications\|CapacitorSplashScreen' Podfile.lock 2>/dev/null | head -30 || echo "No Podfile.lock found"

          echo "=== CAPPluginCall.swift reject method signature ==="
          find Pods -name "CAPPluginCall.swift" 2>/dev/null | while read f; do
            echo "File: $f"
            grep -n 'func reject' "$f" | head -5
          done

      # ── 11b. Patch Capacitor Swift compatibility issues ─────────────────────
      - name: Patch Capacitor Swift compatibility
        run: |
          # The issue: CAPPluginCall.reject() and CAPPluginCall.unimplemented() are
          # declared in @objc public extension but without 'public' modifier on the
          # func itself. This causes Swift compiler errors when compiling plugin
          # packages via SPM (Swift Package Manager).
          #
          # Fix: Replace call.reject(...) and call.unimplemented(...) with call.resolve([:])
          # resolve() is always accessible and avoids the visibility issue.
          #
          # We patch node_modules (used by SPM/Xcode directly) and Pods/ (CocoaPods)

          echo "=== Patching call.reject() and call.unimplemented() -> call.resolve([:]) ==="
          # Use .* instead of [^)]+ to handle arguments with parentheses or long strings
          find "$PWD/node_modules" -name "*.swift" 2>/dev/null | while read f; do
            if grep -q 'call\.reject\|call\.unimplemented' "$f" 2>/dev/null; then
              echo "Patching: $f"
              grep -n 'call\.reject\|call\.unimplemented' "$f" | head -10
              # Replace call.reject(...) with call.resolve([:])
              perl -i -pe 's/call\.reject\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
              # Replace call.unimplemented(...) with call.resolve([:])
              perl -i -pe 's/call\.unimplemented\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
              echo "After patch:"
              grep -n 'call\.reject\|call\.unimplemented\|call\.resolve' "$f" | head -10
            fi
          done

          echo "=== Patching Pods/ Swift files ==="
          PODS_DIR="$PWD/ios/App/Pods"
          find "$PODS_DIR" -name "*.swift" 2>/dev/null | while read f; do
            if grep -q 'call\.reject\|call\.unimplemented' "$f" 2>/dev/null; then
              echo "Patching Pods: $f"
              perl -i -pe 's/call\.reject\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
              perl -i -pe 's/call\.unimplemented\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
            fi
          done

          echo "=== Verifying no remaining call.reject or call.unimplemented in Swift files ==="
          REMAINING=$(find "$PWD/node_modules" -name "*.swift" 2>/dev/null | xargs grep -l 'call\.reject\|call\.unimplemented' 2>/dev/null | wc -l)
          echo "Files with remaining issues: $REMAINING"
          if [ "$REMAINING" -gt 0 ]; then
            echo "WARNING: Some files still have call.reject or call.unimplemented:"
            find "$PWD/node_modules" -name "*.swift" 2>/dev/null | xargs grep -l 'call\.reject\|call\.unimplemented' 2>/dev/null
          fi
          echo "=== Patch complete ==="

      # ── 12. Import Distribution Certificate ───────────────────────────────
      - name: Import Distribution Certificate
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain"
          KEYCHAIN_PASSWORD="temp_keychain_password_$(date +%s)"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Allow codesign to access the key without prompting
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          echo "=== Identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      # ── 13. Install Provisioning Profile ──────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          # Use the actual home directory of the runner user
          RUNNER_HOME=$(eval echo ~$(whoami))
          PROFILES_DIR="$RUNNER_HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          echo "Installing profile to: $PROFILES_DIR"
          echo "Runner user: $(whoami)"
          echo "Runner home: $RUNNER_HOME"

          # Decode the profile to a temp file
          PROFILE_TMP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_TMP"
          echo "Profile file size: $(wc -c < "$PROFILE_TMP") bytes"

          # Method 1: Use macOS native 'security cms' tool (preferred on macOS)
          PROFILE_UUID=""
          PROFILE_NAME=""
          PLIST_TMP="$RUNNER_TEMP/profile.plist"

          if security cms -D -i "$PROFILE_TMP" -o "$PLIST_TMP" 2>/dev/null; then
            echo "security cms decoded successfully"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST_TMP" 2>/dev/null || true)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST_TMP" 2>/dev/null || true)
          fi

          # Method 2: grep UUID pattern directly from binary file
          if [ -z "$PROFILE_UUID" ]; then
            echo "Trying grep method for UUID extraction..."
            PROFILE_UUID=$(grep -a -o '[0-9A-Fa-f]\{8\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{12\}' \
              "$PROFILE_TMP" | head -1)
          fi

          # Method 3: Hardcoded fallback (known UUID from previous successful runs)
          if [ -z "$PROFILE_UUID" ]; then
            echo "WARNING: All extraction methods failed. Using hardcoded UUID as fallback."
            PROFILE_UUID="8bc01236-dcbb-4bc0-9f0e-dfebfd0e615e"
            PROFILE_NAME="DurakOnlineKZ AppStore Distribution"
          fi

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          # === FULL DIAGNOSTICS: show Team ID, expiry, bundle IDs from profile ===
          if [ -f "$PLIST_TMP" ]; then
            echo "=== PROFILE DIAGNOSTICS ==="
            echo "Team ID in profile: $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
            echo "Team Name: $(/usr/libexec/PlistBuddy -c 'Print :TeamName' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
            echo "Expiry: $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
            echo "Bundle IDs: $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
            echo "App ID Name: $(/usr/libexec/PlistBuddy -c 'Print :AppIDName' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
            echo "IOS_TEAM_ID secret value: $IOS_TEAM_ID"
          fi

          # Install profile with UUID as filename (Xcode requires this)
          INSTALLED_PROFILE="$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"
          cp "$PROFILE_TMP" "$INSTALLED_PROFILE"
          echo "Profile installed: $INSTALLED_PROFILE"
          ls -la "$INSTALLED_PROFILE"

          # Also install to Xcode's own provisioning profile cache
          # Xcode 15+ maintains its own database separate from ~/Library/MobileDevice/Provisioning Profiles
          XCODE_PROFILES_DIR="$RUNNER_HOME/Library/Developer/Xcode/UserData/ProvisioningProfiles"
          mkdir -p "$XCODE_PROFILES_DIR"
          cp "$PROFILE_TMP" "$XCODE_PROFILES_DIR/${PROFILE_UUID}.mobileprovision"
          echo "Profile also installed to Xcode cache: $XCODE_PROFILES_DIR/${PROFILE_UUID}.mobileprovision"

          # Also install with name-based filename as fallback
          if [ -n "$PROFILE_NAME" ]; then
            SAFE_NAME=$(echo "$PROFILE_NAME" | tr ' ' '_' | tr -cd '[:alnum:]_-')
            cp "$PROFILE_TMP" "$PROFILES_DIR/${SAFE_NAME}.mobileprovision" 2>/dev/null || true
          fi

          echo "=== All installed profiles ==="
          ls -la "$PROFILES_DIR/"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILES_DIR=$PROFILES_DIR" >> $GITHUB_ENV

      # ── 14. Update Xcode project settings ─────────────────────────────────
      - name: Update Xcode project bundle ID and signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cd ios/App

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          python3 << 'PYEOF'
          import re, os

          pbxproj_path = "App.xcodeproj/project.pbxproj"
          bundle_id = os.environ['IOS_BUNDLE_ID']
          team_id = os.environ['IOS_TEAM_ID']
          profile_uuid = os.environ.get('PROFILE_UUID', '')
          profile_name = os.environ.get('PROFILE_NAME', '')

          print(f"Bundle ID: {bundle_id}")
          print(f"Team ID: {team_id}")
          print(f"Profile UUID: {profile_uuid}")
          print(f"Profile Name: {profile_name}")

          with open(pbxproj_path, "r") as f:
              content = f.read()

          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
                           f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};', content)
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;',
                           f'DEVELOPMENT_TEAM = {team_id};', content)
          # Use AUTOMATIC signing - Xcode will use API key to download profiles from Apple servers
          # This bypasses the local profile database lookup issue entirely
          content = re.sub(r'CODE_SIGN_STYLE = [^;]+;',
                           'CODE_SIGN_STYLE = Automatic;', content)
          # Remove any hardcoded CODE_SIGN_IDENTITY (let Xcode choose automatically)
          content = re.sub(r'CODE_SIGN_IDENTITY = [^;]*;',
                           'CODE_SIGN_IDENTITY = "";', content)
          # Remove ALL manual provisioning profile settings - let Xcode handle automatically
          content = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]*;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE = [^;]*;', '', content)

          with open(pbxproj_path, "w") as f:
              f.write(content)
          print("Xcode project updated successfully")
          PYEOF

          # Patch Pods xcconfig files to remove signing overrides
          find Pods -name "*.xcconfig" 2>/dev/null | while read xcconfig; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d' "$xcconfig" 2>/dev/null || true
            sed -i '' '/^PROVISIONING_PROFILE/d' "$xcconfig" 2>/dev/null || true
          done
          echo "Pods xcconfig files patched"

      # ── 15. Setup App Store Connect API Key ──────────────────────────────
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          # Write the .p8 key file for xcodebuild -allowProvisioningUpdates
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          # The content may be base64-encoded or raw PEM - handle both
          if echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | grep -q 'BEGIN'; then
            # Already PEM format
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"
          else
            # Base64 encoded
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          fi

          echo "API key file size: $(wc -c < "$API_KEY_PATH") bytes"
          echo "API key path: $API_KEY_PATH"
          echo "API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV
          echo "API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >> $GITHUB_ENV

      # ── 16. Build & Archive ────────────────────────────────────────────────
      - name: Build and Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          echo "=== Build environment ==="
          echo "Team ID: $IOS_TEAM_ID"
          echo "Bundle ID: $IOS_BUNDLE_ID"
          echo "API Key Path: $API_KEY_PATH"
          echo "API Key ID: $API_KEY_ID"
          echo "Issuer ID: $APP_STORE_CONNECT_ISSUER_ID"
          echo "Keychain: $KEYCHAIN_PATH"

          # Use xcpretty if available for cleaner output
          if command -v xcpretty &>/dev/null; then
            XCPRETTY_CMD="xcpretty --color"
          else
            XCPRETTY_CMD="cat"
          fi

          # Build with AUTOMATIC signing + API key
          # -allowProvisioningUpdates tells Xcode to download/register profiles from Apple servers
          # This completely bypasses the local profile database lookup issue
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee /tmp/xcodebuild.log | eval "$XCPRETTY_CMD"

          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "=== Archive FAILED! Last 200 lines of build log: ==="
            tail -200 /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive created successfully!"

      # ── 16. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST_EOF

          echo "ExportOptions.plist:"
          cat "$RUNNER_TEMP/ExportOptions.plist"

          mkdir -p "$RUNNER_TEMP/ipa"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee /tmp/export.log

          echo "=== IPA directory contents ==="
          ls -la "$RUNNER_TEMP/ipa/"

      # ── 17. Upload to App Store Connect ────────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found!"
            ls -la "$RUNNER_TEMP/ipa/" || true
            exit 1
          fi
          echo "Uploading: $IPA_PATH"

          # Setup API key for upload
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH" 2>/dev/null || \
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"

          # Upload using xcrun altool with API key authentication
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1

          # Cleanup API key
          rm -f "$API_KEY_PATH" 2>/dev/null || true

      # ── 18. Upload IPA as artifact ─────────────────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakOnlineKZ-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 19. Cleanup ────────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
