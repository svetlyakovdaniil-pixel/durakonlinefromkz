name: iOS Build & App Store Upload

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install pnpm ────────────────────────────────────────────────────
      - name: Install pnpm
        run: npm install -g pnpm

      # ── 4. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        env:
          NODE_ENV: production
          VITE_APP_TITLE: "Durak online from KZ"
          VITE_ADMOB_IOS_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        run: pnpm run build

      # ── 6. Install Capacitor CLI ───────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@8

      # ── 7. Add iOS platform (generates full Xcode project) ─────────────────
      - name: Add iOS platform
        run: |
          # Remove existing ios folder if it only has assets (no xcodeproj)
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "No xcodeproj found, running cap add ios..."
            # Keep existing assets
            cp -r ios/App/App/Assets.xcassets /tmp/AppAssets || true
            cp -r ios/App/App/*.lproj /tmp/ 2>/dev/null || true
            cp ios/App/App/Info.plist /tmp/Info.plist || true
            cp ios/App/App/GoogleService-Info.plist /tmp/GoogleService-Info.plist 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            # Restore custom assets
            cp -r /tmp/AppAssets ios/App/App/Assets.xcassets || true
            for dir in /tmp/*.lproj; do
              [ -d "$dir" ] && cp -r "$dir" "ios/App/App/" || true
            done
            cp /tmp/Info.plist ios/App/App/Info.plist || true
            cp /tmp/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist 2>/dev/null || true
          else
            echo "xcodeproj found, running cap sync..."
          fi
          npx cap sync ios

      # ── 8. Setup Ruby & CocoaPods ──────────────────────────────────────────
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          cd ios/App
          pod install --repo-update

      # ── 9. Install Fastlane ────────────────────────────────────────────────
      - name: Install Fastlane
        run: gem install fastlane --no-document

      # ── 10. Import Distribution Certificate ───────────────────────────────
      - name: Import Distribution Certificate
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain"
          KEYCHAIN_PASSWORD="temp_keychain_password_$(date +%s)"
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          
          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      # ── 11. Install Provisioning Profile ──────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH/DurakOnlineKZ_AppStore.mobileprovision"
          echo "Provisioning profile installed"
          
          # Get UUID from profile
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH/DurakOnlineKZ_AppStore.mobileprovision" 2>/dev/null | \
            /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin 2>/dev/null || \
            grep -a -A1 '<key>UUID</key>' "$PROFILE_PATH/DurakOnlineKZ_AppStore.mobileprovision" | \
            grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          echo "Profile UUID: $PROFILE_UUID"
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      # ── 12. Update Xcode project settings ─────────────────────────────────
      - name: Update Xcode project bundle ID and signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cd ios/App
          
          # Use xcode-build-settings to update bundle ID and team
          # Update project.pbxproj with correct bundle ID and team
          PBXPROJ="App.xcodeproj/project.pbxproj"
          
          # Update PRODUCT_BUNDLE_IDENTIFIER
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $IOS_BUNDLE_ID;/g" "$PBXPROJ"
          
          # Update DEVELOPMENT_TEAM
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = $IOS_TEAM_ID;/g" "$PBXPROJ"
          
          # Set CODE_SIGN_STYLE to Manual
          sed -i '' "s/CODE_SIGN_STYLE = .*/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          
          # Set provisioning profile
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"DurakOnlineKZ AppStore Distribution\";/g" "$PBXPROJ"
          
          echo "Xcode project updated"

      # ── 13. Build & Archive ────────────────────────────────────────────────
      - name: Build and Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cd ios/App
          
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="DurakOnlineKZ AppStore Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            -allowProvisioningUpdates \
            | xcpretty --color || true
          
          # Check if archive was created
          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "Archive failed! Running without xcpretty for full output..."
            xcodebuild archive \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/App.xcarchive" \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
              PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="iPhone Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="DurakOnlineKZ AppStore Distribution" \
              OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          fi

      # ── 14. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          # Create ExportOptions.plist
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key>
              <string>DurakOnlineKZ AppStore Distribution</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          
          echo "IPA exported:"
          ls -la "$RUNNER_TEMP/ipa/"

      # ── 15. Upload to App Store Connect ───────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APPLE_ID: "brbpubg@gmail.com"
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --verbose || \
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "@env:APPLE_APP_SPECIFIC_PASSWORD" \
            --verbose

      # ── 16. Upload IPA as artifact (always) ───────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakOnlineKZ-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 17. Cleanup keychain ───────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
