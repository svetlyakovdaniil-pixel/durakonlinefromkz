name: iOS Build & App Store Upload

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      # ── 0. Setup PATH ──────────────────────────────────────────────────────
      - name: Setup PATH
        run: |
          if [ -f "/opt/homebrew/bin/brew" ]; then
            echo "/opt/homebrew/bin" >> $GITHUB_PATH
            echo "/opt/homebrew/sbin" >> $GITHUB_PATH
          elif [ -f "/usr/local/bin/brew" ]; then
            echo "/usr/local/bin" >> $GITHUB_PATH
          fi
          if [ -d "$HOME/.rbenv/shims" ]; then
            echo "$HOME/.rbenv/shims" >> $GITHUB_PATH
            echo "$HOME/.rbenv/bin" >> $GITHUB_PATH
          fi
          echo "PATH setup complete"

      # ── 1. Verify Xcode ────────────────────────────────────────────────────
      - name: Verify Xcode setup
        run: |
          xcode-select -p
          xcodebuild -version

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Setup pnpm ──────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── 4. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        env:
          NODE_ENV: production
          VITE_APP_TITLE: "Durak online from KZ"
          VITE_ADMOB_IOS_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        run: pnpm run build

      # ── 7. Install Capacitor CLI ───────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@8

      # ── 8. Add iOS platform ────────────────────────────────────────────────
      - name: Add iOS platform
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "No xcodeproj found, running cap add ios..."
            cp -r ios/App/App/Assets.xcassets /tmp/AppAssets || true
            cp -r ios/App/App/*.lproj /tmp/ 2>/dev/null || true
            cp ios/App/App/Info.plist /tmp/Info.plist || true
            cp ios/App/App/GoogleService-Info.plist /tmp/GoogleService-Info.plist 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            cp -r /tmp/AppAssets ios/App/App/Assets.xcassets || true
            for dir in /tmp/*.lproj; do
              [ -d "$dir" ] && cp -r "$dir" "ios/App/App/" || true
            done
            cp /tmp/Info.plist ios/App/App/Info.plist || true
            cp /tmp/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist 2>/dev/null || true
          fi
          npx cap sync ios

      # ── 9. Ensure CocoaPods is available ───────────────────────────────────
      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod &>/dev/null; then
            brew link --overwrite cocoapods 2>/dev/null || brew install cocoapods
          fi
          pod --version

      # ── 10. Ensure Fastlane is available ───────────────────────────────────
      - name: Ensure Fastlane is available
        run: |
          if ! command -v fastlane &>/dev/null; then
            brew link --overwrite fastlane 2>/dev/null || brew install fastlane
          fi
          fastlane --version

      # ── 11. Install CocoaPods dependencies ─────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          # Create Podfile if missing (cap sync doesn't always create it)
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Creating Podfile from base64..."
            echo "" | base64 --decode > ios/App/Podfile
            echo "Podfile created."
          fi

          # Run cap sync to populate Podfile with all plugins
          npx cap sync ios --no-build 2>&1 || npx cap sync ios 2>&1 || true

          cd ios/App
          pod install --no-repo-update 2>&1 || pod install 2>&1

          echo "=== Podfile.lock - Capacitor versions ==="
          grep -A2 'Capacitor\|CapacitorSplashScreen\|CapacitorPushNotifications' Podfile.lock 2>/dev/null | head -30 || echo "No Podfile.lock found"

      # ── 12. Pin capacitor-swift-pm to 8.1.0 ───────────────────────────────
      # SPM resolves "from: 8.0.0" to latest (8.3.x) which has breaking API changes.
      # We pin all Package.swift files to exact: "8.1.0" so SPM uses compatible version.
      - name: Pin capacitor-swift-pm to 8.1.0 in Package.swift files
        run: |
          echo "=== Pinning capacitor-swift-pm to exact version 8.1.0 ==="
          find "$GITHUB_WORKSPACE/node_modules" -name "Package.swift" 2>/dev/null | while read f; do
            if grep -q 'capacitor-swift-pm' "$f" 2>/dev/null; then
              echo "Pinning: $f"
              perl -i -pe 's|(url: "https://github\.com/ionic-team/capacitor-swift-pm\.git",)\s*from: "[^"]+"|$1 exact: "8.1.0"|g' "$f" 2>/dev/null || true
              grep 'capacitor-swift-pm' "$f"
            fi
          done
          echo "=== Package.swift pinning complete ==="

          # Fix call.reject() and call.unimplemented() - these are not accessible in SPM builds
          echo "=== Patching call.reject/unimplemented -> call.resolve([:]) ==="
          find "$GITHUB_WORKSPACE/node_modules" -name "*.swift" 2>/dev/null | while read f; do
            if grep -q 'call\.reject\|call\.unimplemented' "$f" 2>/dev/null; then
              perl -i -pe 's/call\.reject\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
              perl -i -pe 's/call\.unimplemented\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
            fi
          done
          find "$GITHUB_WORKSPACE/ios/App/Pods" -name "*.swift" 2>/dev/null | while read f; do
            if grep -q 'call\.reject\|call\.unimplemented' "$f" 2>/dev/null; then
              perl -i -pe 's/call\.reject\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
              perl -i -pe 's/call\.unimplemented\(.*\)/call.resolve([:])/g' "$f" 2>/dev/null || true
            fi
          done

          # Fix PushNotifications API incompatibilities with @capacitor/ios@8.1.0
          echo "=== Patching PushNotifications API ==="
          PUSH_HANDLER=$(find "$GITHUB_WORKSPACE/node_modules" -path "*/push-notifications*/PushNotificationsHandler.swift" 2>/dev/null | head -1)
          PUSH_PLUGIN=$(find "$GITHUB_WORKSPACE/node_modules" -path "*/push-notifications*/PushNotificationsPlugin.swift" 2>/dev/null | head -1)
          if [ -n "$PUSH_HANDLER" ] && [ -f "$PUSH_HANDLER" ]; then
            perl -i -pe 's/self\.plugin\?\.getConfig\(\)\.getArray\("presentationOptions"\)/self.plugin?.getConfig().getConfigJSON()["presentationOptions"]/g' "$PUSH_HANDLER" 2>/dev/null || true
            perl -i -pe 's/JSTypes\.coerceDictionaryToJSObject\([^)]+\)\s*\?\?\s*\[:\]/(request.content.userInfo as? JSObject) ?? [:]/g' "$PUSH_HANDLER" 2>/dev/null || true
          fi
          if [ -n "$PUSH_PLUGIN" ] && [ -f "$PUSH_PLUGIN" ]; then
            perl -i -pe 's/call\.getArray\("notifications",\s*JSObject\.self\)/call.getArray("notifications", []) as? [JSObject]/g' "$PUSH_PLUGIN" 2>/dev/null || true
          fi
          find "$GITHUB_WORKSPACE/ios/App/Pods" -name "PushNotificationsHandler.swift" 2>/dev/null | while read f; do
            perl -i -pe 's/self\.plugin\?\.getConfig\(\)\.getArray\("presentationOptions"\)/self.plugin?.getConfig().getConfigJSON()["presentationOptions"]/g' "$f" 2>/dev/null || true
            perl -i -pe 's/JSTypes\.coerceDictionaryToJSObject\([^)]+\)\s*\?\?\s*\[:\]/(request.content.userInfo as? JSObject) ?? [:]/g' "$f" 2>/dev/null || true
          done
          find "$GITHUB_WORKSPACE/ios/App/Pods" -name "PushNotificationsPlugin.swift" 2>/dev/null | while read f; do
            perl -i -pe 's/call\.getArray\("notifications",\s*JSObject\.self\)/call.getArray("notifications", []) as? [JSObject]/g' "$f" 2>/dev/null || true
          done
          echo "=== All patches applied ==="

      # ── 13. Resolve SPM dependencies and pin Package.resolved ─────────────
      # This is the KEY step: after pinning Package.swift to exact: "8.1.0",
      # we resolve dependencies so SPM creates Package.resolved with 8.1.0.
      # The Package.resolved file locks the version for the actual build.
      - name: Resolve SPM dependencies and pin Package.resolved to 8.1.0
        run: |
          cd ios/App

          echo "=== Resolving SPM package dependencies ==="
          xcodebuild -resolvePackageDependencies \
            -workspace App.xcworkspace \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            2>&1 | tail -30 || true

          echo "=== Finding Package.resolved files ==="
          find . "$RUNNER_TEMP/SourcePackages" -name "Package.resolved" 2>/dev/null | while read f; do
            echo "Found: $f"
            echo "--- Content ---"
            cat "$f"
            echo "--- End ---"
          done

          echo "=== Patching Package.resolved to pin capacitor-swift-pm to 8.1.0 ==="
          find . "$RUNNER_TEMP/SourcePackages" -name "Package.resolved" 2>/dev/null | while read f; do
            if grep -q 'capacitor-swift-pm' "$f" 2>/dev/null; then
              echo "Patching: $f"
              # Use sed to replace any 8.2.x or 8.3.x version with 8.1.0 for capacitor-swift-pm
              sed -i '' 's/"version" : "8\.[2-9]\.[0-9]*"/"version" : "8.1.0"/g' "$f" 2>/dev/null || \
              sed -i 's/"version" : "8\.[2-9]\.[0-9]*"/"version" : "8.1.0"/g' "$f" 2>/dev/null || true
              echo "After patch:"
              grep -A3 'capacitor-swift-pm' "$f" || true
            fi
          done
          echo "=== Package.resolved pinning complete ==="

      # ── 14. Import Distribution Certificate ───────────────────────────────
      - name: Import Distribution Certificate
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain"
          KEYCHAIN_PASSWORD="temp_keychain_password_$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          echo "=== Identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      # ── 15. Install Provisioning Profile ──────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          RUNNER_HOME=$(eval echo ~$(whoami))
          PROFILES_DIR="$RUNNER_HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          PROFILE_TMP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_TMP"
          echo "Profile file size: $(wc -c < "$PROFILE_TMP") bytes"

          PROFILE_UUID=""
          PROFILE_NAME=""
          PLIST_TMP="$RUNNER_TEMP/profile.plist"

          if security cms -D -i "$PROFILE_TMP" -o "$PLIST_TMP" 2>/dev/null; then
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST_TMP" 2>/dev/null || true)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST_TMP" 2>/dev/null || true)
          fi

          if [ -z "$PROFILE_UUID" ]; then
            PROFILE_UUID=$(grep -a -o '[0-9A-Fa-f]\{8\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{4\}-[0-9A-Fa-f]\{12\}' \
              "$PROFILE_TMP" | head -1)
          fi

          if [ -z "$PROFILE_UUID" ]; then
            PROFILE_UUID="8bc01236-dcbb-4bc0-9f0e-dfebfd0e615e"
            PROFILE_NAME="DurakOnlineKZ AppStore Distribution"
          fi

          echo "Profile UUID: $PROFILE_UUID"
          echo "Profile Name: $PROFILE_NAME"

          if [ -f "$PLIST_TMP" ]; then
            echo "Team ID in profile: $(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
            echo "Expiry: $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PLIST_TMP" 2>/dev/null || echo 'N/A')"
          fi

          cp "$PROFILE_TMP" "$PROFILES_DIR/${PROFILE_UUID}.mobileprovision"

          XCODE_PROFILES_DIR="$RUNNER_HOME/Library/Developer/Xcode/UserData/ProvisioningProfiles"
          mkdir -p "$XCODE_PROFILES_DIR"
          cp "$PROFILE_TMP" "$XCODE_PROFILES_DIR/${PROFILE_UUID}.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILES_DIR=$PROFILES_DIR" >> $GITHUB_ENV

      # ── 16. Update Xcode project settings ─────────────────────────────────
      - name: Update Xcode project bundle ID and signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cd ios/App

          python3 << 'PYEOF'
          import re, os

          pbxproj_path = "App.xcodeproj/project.pbxproj"
          bundle_id = os.environ['IOS_BUNDLE_ID']
          team_id = os.environ['IOS_TEAM_ID']

          with open(pbxproj_path, "r") as f:
              content = f.read()

          content = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
                           f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};', content)
          content = re.sub(r'DEVELOPMENT_TEAM = [^;]*;',
                           f'DEVELOPMENT_TEAM = {team_id};', content)
          content = re.sub(r'CODE_SIGN_STYLE = [^;]+;',
                           'CODE_SIGN_STYLE = Automatic;', content)
          content = re.sub(r'CODE_SIGN_IDENTITY = [^;]*;',
                           'CODE_SIGN_IDENTITY = "";', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]*;', '', content)
          content = re.sub(r'\s*PROVISIONING_PROFILE = [^;]*;', '', content)

          with open(pbxproj_path, "w") as f:
              f.write(content)
          print("Xcode project updated successfully")
          PYEOF

          find Pods -name "*.xcconfig" 2>/dev/null | while read xcconfig; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d' "$xcconfig" 2>/dev/null || true
            sed -i '' '/^PROVISIONING_PROFILE/d' "$xcconfig" 2>/dev/null || true
          done

      # ── 17. Setup App Store Connect API Key ──────────────────────────────
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          if echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | grep -q 'BEGIN'; then
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"
          else
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          fi

          echo "API key file size: $(wc -c < "$API_KEY_PATH") bytes"
          echo "API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV
          echo "API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >> $GITHUB_ENV

      # ── 18. Build & Archive ────────────────────────────────────────────────
      - name: Build and Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          echo "=== Build environment ==="
          echo "Team ID: $IOS_TEAM_ID"
          echo "Bundle ID: $IOS_BUNDLE_ID"
          echo "Keychain: $KEYCHAIN_PATH"

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee /tmp/xcodebuild.log

          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "========================================"
            echo "=== ARCHIVE FAILED — SWIFT ERRORS ==="
            echo "========================================"
            grep ' error:' /tmp/xcodebuild.log || true
            echo ""
            echo "=== RESOLVED SPM PACKAGES ==="
            find "$RUNNER_TEMP/SourcePackages" -name "Package.resolved" 2>/dev/null | while read f; do
              echo "--- $f ---"
              cat "$f"
            done
            exit 1
          fi
          echo "Archive created successfully!"

      # ── 19. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST_EOF

          mkdir -p "$RUNNER_TEMP/ipa"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee /tmp/export.log

          echo "=== IPA directory contents ==="
          ls -la "$RUNNER_TEMP/ipa/"

      # ── 20. Upload to App Store Connect ────────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found!"
            exit 1
          fi
          echo "Uploading: $IPA_PATH"

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH" 2>/dev/null || \
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1

          rm -f "$API_KEY_PATH" 2>/dev/null || true

      # ── 21. Upload IPA as artifact ─────────────────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakOnlineKZ-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 22. Cleanup ────────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
