            /assets/cards/ace_hearts_dffa2bc3_5d609c81.webp
            /assets/cards/777_66c2a698_5c911fbe.webp
            # Card backs
            /assets/cards/card_back_classic_8ad2e43d.webp
            /assets/cards/card_back_custom_987db1bc.webp
            # Table backgrounds
            /assets/cards/game_table-9KeBRLr2mzuAL8uVYsQsVq_609274c2.webp
            /assets/cards/khansky_oktogon_table_523470d5_4ddcf50d.webp
            /assets/cards/neon_table-eY4ptBJDmBaDo69F5sQkTp_8807fcae.webp
            /assets/cards/table_apocalypse-H8YjUxzbwgWkFc5HnxrkhG_3d34531b.webp
            /assets/cards/table-galaxy-fixed_b6059c99_010d3863.webp
            /assets/cards/table_sea_depths_8d949ab4_41a8569c.webp
            /assets/cards/table_stargazer_95bf3fd6_794bfd11.webp
            /assets/cards/khan_black_velvet_table_v3-5FMgqXZn8wa4Eo6sPsUP8f_be451c88.webp
            # Free avatars
            /assets/avatars/avatar_fox_smug-fJkNAyA3ddNsq2NQbDnhxF.webp
            /assets/avatars/avatar_bear_angry-BgGpArBiGaongtJtNqPrPP.webp
            /assets/avatars/avatar_owl_wise-YmXBTYp2RGoRCkSjUGkKLs.webp
            /assets/avatars/avatar_cat_lazy-4fa5o8JrJbsoGukvmiRYck.webp
            /assets/avatars/avatar_wolf_fierce-jxRuqcVyJiD2VL2nhXrK9b.webp
            /assets/avatars/avatar_tiger_proud-33ax6W3gWEbAUXyPmFNsEK.webp
            /assets/avatars/avatar_panda_happy-kPPArBc2zvKGbib5i2GzFS.webp
            /assets/avatars/avatar_eagle_determined-gks9AN9EiDq2fM34wDAitN.webp
            /assets/avatars/avatar_snow_leopard_calm-jfAGUjmLVzuYTVxYKyPMAd.webp
            /assets/avatars/avatar_raccoon_mischievous-aAdKvfGW7K3WLV8SdDhLPL.webp
          )
          for path in "${ASSETS[@]}"; do
            dir=$(dirname "$path")
            target="client/public$path"
            [ -f "$target" ] || wget -q -O "$target" "$BASE_URL$path" &
          done
          wait
          echo "Cards downloaded: $(ls client/public/assets/cards/ | wc -l)"
          echo "Avatars downloaded: $(ls client/public/assets/avatars/ | wc -l)"

      # ── 6. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        env:
          NODE_ENV: production
          VITE_APP_TITLE: "Durak online from KZ"
          VITE_ADMOB_IOS_APP_ID: "ca-app-pub-3940256099942544~1458002511"
          VITE_ADMOB_IOS_REWARDED_AD_UNIT_ID: "ca-app-pub-3940256099942544/1712485313"
          VITE_REVENUECAT_IOS_KEY: "appl_GdpfUqDfDgVtrHhTWhmzgSCogqz"
        run: pnpm run build

      # ── 7. Install Capacitor CLI ───────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@8

      # ── 8. Add iOS platform ────────────────────────────────────────────────
      - name: Add iOS platform
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "No xcodeproj found, running cap add ios..."
            cp -r ios/App/App/Assets.xcassets /tmp/AppAssets || true
            cp -r ios/App/App/*.lproj /tmp/ 2>/dev/null || true
            cp ios/App/App/Info.plist /tmp/Info.plist || true
            cp ios/App/App/GoogleService-Info.plist /tmp/GoogleService-Info.plist 2>/dev/null || true
            cp ios/App/App/AppRelease.entitlements /tmp/AppRelease.entitlements 2>/dev/null || true
            cp ios/App/App/AppleSignInPlugin.swift /tmp/AppleSignInPlugin.swift 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            cp -r /tmp/AppAssets ios/App/App/Assets.xcassets || true
            for dir in /tmp/*.lproj; do
              [ -d "$dir" ] && cp -r "$dir" "ios/App/App/" || true
            done
            cp /tmp/Info.plist ios/App/App/Info.plist || true
            cp /tmp/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist 2>/dev/null || true
            cp /tmp/AppRelease.entitlements ios/App/App/AppRelease.entitlements 2>/dev/null || true
            [ -f /tmp/AppleSignInPlugin.swift ] && cp /tmp/AppleSignInPlugin.swift ios/App/App/AppleSignInPlugin.swift || true
          fi
          # Ensure AppleSignInPlugin.swift is present after cap sync
          if [ ! -f "ios/App/App/AppleSignInPlugin.swift" ]; then
            git show HEAD:ios/App/App/AppleSignInPlugin.swift > ios/App/App/AppleSignInPlugin.swift 2>/dev/null || true
          fi
          npx cap sync ios
          # Register AppleSignInPlugin.swift in the Xcode project
          python3 .github/scripts/add_swift_to_xcode.py ios/App/App.xcodeproj/project.pbxproj ios/App/App/AppleSignInPlugin.swift

      # ── 8b. Set version and build number ─────────────────────────────────────
      - name: Set version and build number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version ${{ github.event.inputs.version || '1.0.73' }}
          xcrun agvtool new-version -all ${{ github.event.inputs.build_number || github.run_number }}

      # ── 9. Ensure CocoaPods is available ───────────────────────────────────
      - name: Ensure CocoaPods is available
        run: |
          if ! command -v pod &>/dev/null; then
            brew link --overwrite cocoapods 2>/dev/null || brew install cocoapods
          fi
          pod --version

      # ── 10. Ensure Fastlane is available ───────────────────────────────────
      - name: Ensure Fastlane is available
        run: |
          if ! command -v fastlane &>/dev/null; then
            brew link --overwrite fastlane 2>/dev/null || brew install fastlane
          fi
          fastlane --version

      # ── 11. Install CocoaPods dependencies ─────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          # Create Podfile if missing (cap sync doesn't always create it)
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Creating Podfile from base64..."
            echo "" | base64 --decode > ios/App/Podfile
            echo "Podfile created."
          fi

          # Run cap sync to populate Podfile with all plugins
          npx cap sync ios --no-build 2>&1 || npx cap sync ios 2>&1 || true

          cd ios/App
          pod install --no-repo-update 2>&1 || pod install 2>&1

          echo "=== Podfile.lock - Capacitor versions ==="
          grep -A2 'Capacitor\|CapacitorSplashScreen\|CapacitorPushNotifications' Podfile.lock 2>/dev/null | head -30 || echo "No Podfile.lock found"

      # ── 12. Patch capacitor plugin sources for capacitor-swift-pm 8.1.0 ──────
      # capacitor-swift-pm 8.1.0 is a binary XCFramework that lacks several APIs
      # present in @capacitor/ios 8.1.0 (CocoaPods). We patch the plugin Swift
      # source files in node_modules directly before Xcode compiles them.
      - name: Patch capacitor plugin sources for capacitor-swift-pm 8.1.0 compatibility
        run: python3 .github/scripts/patch_capacitor_plugins.py

      # ── 13. Import Distribution Certificate ───────────────────────────────
      - name: Import Distribution Certificate
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain"
          KEYCHAIN_PASSWORD="temp_keychain_password_$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          echo "=== Identities in keychain ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      # ── 14. Install Provisioning Profile ──────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          python3 .github/scripts/install_provisioning_profile.py

      # ── 15. Update Xcode project settings ─────────────────────────────────
      - name: Update Xcode project bundle ID and signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
        run: |
          cd ios/App

          echo "PROFILE_UUID from env: ${PROFILE_UUID:-<not set>}"
          python3 ../../.github/scripts/update_xcode_signing.py

          find Pods -name "*.xcconfig" 2>/dev/null | while read xcconfig; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d' "$xcconfig" 2>/dev/null || true
            sed -i '' '/^PROVISIONING_PROFILE/d' "$xcconfig" 2>/dev/null || true
          done

      # ── 16. Setup App Store Connect API Key ──────────────────────────────
      - name: Setup App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          if echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | grep -q 'BEGIN'; then
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"
          else
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > "$API_KEY_PATH"
          fi

          echo "API key file size: $(wc -c < "$API_KEY_PATH") bytes"
          echo "API_KEY_PATH=$API_KEY_PATH" >> $GITHUB_ENV
          echo "API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >> $GITHUB_ENV

      # ── 17. Resolve SPM deps + inject shim ───────────────────────────────────
      - name: Resolve SPM dependencies and inject CapacitorCompatibility shim
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          echo "=== Resolving SPM package dependencies ==="
          xcodebuild -resolvePackageDependencies \
            -workspace App.xcworkspace \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            2>&1 | tail -20 || true

          echo "=== Injecting CapacitorCompatibility.swift into SourcePackages/checkouts ==="
          COMPAT_FILE="/tmp/CapacitorCompatibility.swift"
          # Decode the shim (same base64 as step 12)
          echo "" | base64 --decode > "$COMPAT_FILE"
          echo "Shim: $(wc -l < $COMPAT_FILE) lines"

          # Inject into every Sources directory in SourcePackages/checkouts
          CHECKOUTS="$RUNNER_TEMP/SourcePackages/checkouts"
          if [ -d "$CHECKOUTS" ]; then
            find "$CHECKOUTS" -path "*/ios/Sources" -type d 2>/dev/null | while read srcdir; do
              echo "Injecting into: $srcdir"
              cp "$COMPAT_FILE" "$srcdir/CapacitorCompatibility.swift"
            done
            # Also patch bridge.viewController/webView in checkouts
            find "$CHECKOUTS" -name "*.swift" 2>/dev/null | while read f; do
              if grep -q 'bridge.*viewController\|bridge.*webView' "$f" 2>/dev/null; then
                perl -i '' -pe 's/\bbridge\??\.viewController\b/self.webView?.next as? UIViewController/g' "$f" 2>/dev/null || true
                perl -i '' -pe 's/\bbridge\??\.webView\b/self.webView/g' "$f" 2>/dev/null || true
              fi
            done
            # Also patch PushNotifications in checkouts
            find "$CHECKOUTS" -name "PushNotificationsHandler.swift" 2>/dev/null | while read f; do
              perl -i '' -pe 's/self\.plugin\?\.getConfig\(\)\.getArray\("presentationOptions"\)/self.plugin?.getConfig().getConfigJSON()["presentationOptions"]/g' "$f" 2>/dev/null || true
              perl -i '' -pe 's/JSTypes\.coerceDictionaryToJSObject\([^)]+\)\s*\?\?\s*\[:\]/(request.content.userInfo as? JSObject) ?? [:]/g' "$f" 2>/dev/null || true
            done
            find "$CHECKOUTS" -name "PushNotificationsPlugin.swift" 2>/dev/null | while read f; do
              perl -i '' -pe 's/call\.getArray\("notifications",\s*JSObject\.self\)/call.getArray("notifications", []) as? [JSObject]/g' "$f" 2>/dev/null || true
            done
            echo "=== Injection into SourcePackages/checkouts complete ==="
          else
            echo "WARNING: SourcePackages/checkouts not found at $CHECKOUTS"
            ls -la "$RUNNER_TEMP/SourcePackages/" 2>/dev/null || echo "SourcePackages dir empty"
          fi

      # ── 17b. Diagnose PushNotifications source files ─────────────────────────
      - name: Diagnose PushNotifications source files
        run: |
          echo "=== PushNotificationsPlugin.swift (first 50 lines) ==="
          PUSH_DIR=$(find . -path "*push-notifications*/PushNotificationsPlugin" -type d 2>/dev/null | head -1)
          if [ -n "$PUSH_DIR" ]; then
            echo "Found at: $PUSH_DIR"
            head -50 "$PUSH_DIR/PushNotificationsPlugin.swift" 2>/dev/null || echo "File not found"
            echo "--- PushNotificationsHandler.swift ---"
            cat "$PUSH_DIR/PushNotificationsHandler.swift" 2>/dev/null || echo "File not found"
            echo "--- All .swift files in dir ---"
            ls -la "$PUSH_DIR/" 2>/dev/null
          else
            echo "PushNotifications plugin dir not found"
            find . -name "PushNotificationsPlugin.swift" 2>/dev/null | head -5
          fi
          echo "=== Capacitor 8.1.0 getArray signatures ==="
          grep -n "func getArray" node_modules/.pnpm/@capacitor+ios@8.1.0_@capacitor+core@8.1.0/node_modules/@capacitor/ios/Capacitor/Capacitor/JSTypes.swift 2>/dev/null || echo "Not found"
          echo "=== SplashScreenPlugin.swift (8.1.0) - after patch ==="
          SPLASH_FILE=$(find . -path "*@capacitor+core@8.1.0*splash-screen*SplashScreenPlugin.swift" 2>/dev/null | head -1)
          if [ -n "$SPLASH_FILE" ]; then
            echo "Found at: $SPLASH_FILE"
            cat -n "$SPLASH_FILE"
          else
            echo "SplashScreenPlugin.swift (8.1.0) not found"
            find . -name "SplashScreenPlugin.swift" 2>/dev/null
          fi

      # ── 18. Build & Archive ────────────────────────────────────────────────
      - name: Build and Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          cd ios/App

          echo "=== Build environment ==="
          echo "Team ID: $IOS_TEAM_ID"
          echo "Bundle ID: $IOS_BUNDLE_ID"
          echo "Keychain: $KEYCHAIN_PATH"

          COMMON_ARGS=(
            -workspace App.xcworkspace
            -scheme App
            -configuration Release
            -archivePath "$RUNNER_TEMP/App.xcarchive"
            -destination "generic/platform=iOS"
            -allowProvisioningUpdates
            -authenticationKeyPath "$API_KEY_PATH"
            -authenticationKeyID "$API_KEY_ID"
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
            -skipPackagePluginValidation
            -skipMacroValidation
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
            DEVELOPMENT_TEAM="$IOS_TEAM_ID"
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          )

          if [ -n "$PROFILE_UUID" ]; then
            echo "Building with MANUAL signing, profile: $PROFILE_UUID"
            xcodebuild archive "${COMMON_ARGS[@]}" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE="$PROFILE_UUID" \
              2>&1 | tee /tmp/xcodebuild.log
          else
            echo "Building with AUTOMATIC signing"
            xcodebuild archive "${COMMON_ARGS[@]}" \
              CODE_SIGN_STYLE=Automatic \
              2>&1 | tee /tmp/xcodebuild.log
          fi

          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "========================================"
            echo "=== ARCHIVE FAILED - FIRST 30 ERRORS ==="
            echo "========================================"
            grep -m 30 ' error:' /tmp/xcodebuild.log || echo "No 'error:' lines found"
            echo ""
            echo "=== LAST 50 LINES OF BUILD LOG ==="
            tail -50 /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive created successfully!"

      # ── 18. Export IPA ─────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # Use PROFILE_UUID set by Install Provisioning Profile step
          PROFILE_UUID="${PROFILE_UUID:-}"

          if [ -n "$PROFILE_UUID" ]; then
            echo "Using manual signing with profile UUID: $PROFILE_UUID"
            cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF
          else
            echo "No PROFILE_UUID found, falling back to automatic signing"
            cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF
          fi

          echo "=== ExportOptions.plist ==="
          cat "$RUNNER_TEMP/ExportOptions.plist"

          mkdir -p "$RUNNER_TEMP/ipa"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee /tmp/export.log

          echo "=== Export log (last 20 lines) ==="
          tail -20 /tmp/export.log

          echo "=== IPA directory contents ==="
          ls -la "$RUNNER_TEMP/ipa/"

      # ── 19. Upload to App Store Connect ────────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found!"
            exit 1
          fi
          echo "Uploading: $IPA_PATH"

          # The API key from secrets may be stored as raw PEM or base64-encoded PEM.
          # altool requires the raw PEM .p8 file (starts with ***REMOVED***)
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          # Try base64 decode first; if result starts with -----BEGIN, it's already PEM
          DECODED=$(echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode 2>/dev/null || true)
          if echo "$DECODED" | grep -q "BEGIN"; then
            echo "$DECODED" > "$API_KEY_PATH"
            echo "API key: decoded from base64"
          else
            # Already raw PEM
            echo "$APP_STORE_CONNECT_API_KEY_CONTENT" > "$API_KEY_PATH"
            echo "API key: stored as raw PEM"
          fi

          echo "API key file size: $(wc -c < "$API_KEY_PATH") bytes"
          head -1 "$API_KEY_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose \
            2>&1

          UPLOAD_STATUS=$?
          rm -f "$API_KEY_PATH" 2>/dev/null || true

          if [ $UPLOAD_STATUS -ne 0 ]; then
            echo "Upload failed with status $UPLOAD_STATUS"
            exit $UPLOAD_STATUS
          fi
          echo "Upload to App Store Connect succeeded!"

      # ── 20. Upload IPA as artifact ─────────────────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakOnlineKZ-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 21. Cleanup ────────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
