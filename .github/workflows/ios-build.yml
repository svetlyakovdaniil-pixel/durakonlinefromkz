name: iOS Build & App Store Upload

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
      - '.github/scripts/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.0.71)'
        required: true
        default: '1.0.73'
      build_number:
        description: 'Build number (e.g. 23)'
        required: true
        default: '98'
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App
    # NOTE: Uses GitHub-hosted macos-26 runner (NOT self-hosted Mac).
    # Self-hosted runner (MacBook-Pro-An) is often offline — always use macos-26.
    # To trigger a build manually: go to Actions → iOS Build & App Store Upload → Run workflow
    # and enter the version and build_number.
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      # ── 0. Select Xcode ────────────────────────────────────────────────────
      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer 2>/dev/null || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcode-select -p
          xcodebuild -version

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Setup pnpm ──────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── 4. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 4b. Cache pnpm store (self-hosted runner) ──────────────────────────
      - name: Get pnpm store directory
        id: pnpm-cache-dir
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache-dir.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5b. Download bundled game assets (cards, avatars, tables) ──────────
      - name: Download bundled game assets
        run: |
          BASE_URL="https://durakonlinefromkz.online"
          mkdir -p client/public/assets/cards client/public/assets/avatars
          # Download all card and avatar assets in parallel
          ASSETS=(
            # Deck 1 (Batyr)
            /assets/cards/king_spades_batyr_78c9c564_1b2370cd.webp
            /assets/cards/king_hearts_batyr_v2_c3155002_42eedeb4.webp
            /assets/cards/king_diamonds_batyr_v2_58b932e2_570cad37.webp
            /assets/cards/king_clubs_batyr_v2_42b6c3f2_5f91c718.webp
            /assets/cards/queen_spades_batyr_v2_96732a86_a97adfb4.webp
