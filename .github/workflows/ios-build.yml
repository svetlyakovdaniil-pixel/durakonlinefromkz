name: iOS Build & App Store Upload

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
    inputs:
      upload_to_appstore:
        description: 'Upload to App Store Connect'
        required: false
        default: 'true'
        type: boolean

jobs:
  build-ios:
    name: Build iOS App
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      # ── 0. Setup PATH (Homebrew is at /opt/homebrew on this runner) ────────
      - name: Setup PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/sbin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH
          echo "PATH set: /opt/homebrew/bin added"
          ls /opt/homebrew/bin/brew && echo "brew found at /opt/homebrew/bin/brew" || echo "brew NOT found"

      # ── 1. Fix Xcode developer directory ──────────────────────────────────
      - name: Fix Xcode developer directory
        run: |
          echo "=== Current xcode-select path ==="
          xcode-select -p || true
          echo "=== Looking for Xcode.app ==="
          ls /Applications/ | grep -i xcode || echo "No Xcode in /Applications"
          find /Applications -name "Xcode.app" -maxdepth 2 2>/dev/null || echo "Xcode.app not found in /Applications"
          # Fix xcode-select to point to Xcode.app instead of CommandLineTools
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
            echo "xcode-select fixed to Xcode.app"
          elif [ -d "/Applications/Xcode_16.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
            echo "xcode-select fixed to Xcode_16.app"
          elif [ -d "/Applications/Xcode_15.app/Contents/Developer" ]; then
            sudo xcode-select -s /Applications/Xcode_15.app/Contents/Developer
            echo "xcode-select fixed to Xcode_15.app"
          else
            XCODE_PATH=$(find /Applications -name "*.app" -maxdepth 1 | xargs -I{} find {} -name "xcodebuild" -maxdepth 5 2>/dev/null | head -1 | sed 's|/usr/bin/xcodebuild||' | sed 's|/Contents/Developer.*||')
            if [ -n "$XCODE_PATH" ]; then
              sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
              echo "xcode-select fixed to $XCODE_PATH"
            else
              echo "ERROR: Could not find Xcode.app! xcodebuild will fail."
              xcode-select -p
            fi
          fi
          echo "=== xcode-select after fix ==="
          xcode-select -p
          echo "=== xcodebuild version ==="
          xcodebuild -version || echo "xcodebuild failed - Xcode not properly configured"

      # ── 2. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 3. Setup pnpm ────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # ── 4. Setup Node.js ───────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 6. Build web app ───────────────────────────────────────────────────
      - name: Build web app
        env:
          NODE_ENV: production
          VITE_APP_TITLE: "Durak online from KZ"
          VITE_ADMOB_IOS_APP_ID: "ca-app-pub-3940256099942544~1458002511"
        run: pnpm run build

      # ── 7. Install Capacitor CLI ───────────────────────────────────────────
      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli@8

      # ── 8. Add iOS platform (generates full Xcode project) ─────────────────
      - name: Add iOS platform
        run: |
          if [ ! -f "ios/App/App.xcodeproj/project.pbxproj" ]; then
            echo "No xcodeproj found, running cap add ios..."
            cp -r ios/App/App/Assets.xcassets /tmp/AppAssets || true
            cp -r ios/App/App/*.lproj /tmp/ 2>/dev/null || true
            cp ios/App/App/Info.plist /tmp/Info.plist || true
            cp ios/App/App/GoogleService-Info.plist /tmp/GoogleService-Info.plist 2>/dev/null || true
            rm -rf ios
            npx cap add ios
            cp -r /tmp/AppAssets ios/App/App/Assets.xcassets || true
            for dir in /tmp/*.lproj; do
              [ -d "$dir" ] && cp -r "$dir" "ios/App/App/" || true
            done
            cp /tmp/Info.plist ios/App/App/Info.plist || true
            cp /tmp/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist 2>/dev/null || true
          else
            echo "xcodeproj found, running cap sync..."
          fi
          npx cap sync ios

      # ── 9. Install CocoaPods via Homebrew ──────────────────────────────────
      - name: Install CocoaPods
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          echo "=== Checking for pod ==="
          which pod && pod --version && echo "CocoaPods already installed, skipping" && exit 0 || true
          echo "=== Installing CocoaPods via Homebrew ==="
          /opt/homebrew/bin/brew install cocoapods
          echo "=== Verifying pod installation ==="
          which pod || /opt/homebrew/bin/pod --version
          pod --version || /opt/homebrew/bin/pod --version

      # ── 10. Install Fastlane via Homebrew ──────────────────────────────────
      - name: Install Fastlane
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          echo "=== Checking for fastlane ==="
          which fastlane && fastlane --version && echo "Fastlane already installed, skipping" && exit 0 || true
          echo "=== Installing Fastlane via Homebrew ==="
          /opt/homebrew/bin/brew install fastlane
          echo "=== Verifying fastlane installation ==="
          fastlane --version || /opt/homebrew/bin/fastlane --version

      # ── 11. Install CocoaPods dependencies ─────────────────────────────────
      - name: Install CocoaPods dependencies
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          echo "=== iOS directory structure ==="
          find ios -name "Podfile" -o -name "*.xcodeproj" -o -name "*.xcworkspace" 2>/dev/null | head -20
          echo "=== Contents of ios/App ==="
          ls -la ios/App/ 2>/dev/null || echo "ios/App not found"

          # Create Podfile using base64-encoded content (avoids YAML ':' parsing issues)
          if [ ! -f "ios/App/Podfile" ]; then
            echo "Creating Podfile from base64..."
            echo "" | base64 --decode > ios/App/Podfile
            echo "Podfile created."
          fi

          # Run cap sync to populate Podfile with all plugins automatically
          echo "Running cap sync to populate Podfile with plugins..."
          npx cap sync ios --no-build 2>&1 || npx cap sync ios 2>&1 || true

          echo "=== Podfile after cap sync ==="
          cat ios/App/Podfile

          cd ios/App
          pod install --repo-update

      # ── 12. Import Distribution Certificate ───────────────────────────────
      - name: Import Distribution Certificate
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-build.keychain"
          KEYCHAIN_PASSWORD="temp_keychain_password_$(date +%s)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      # ── 13. Install Provisioning Profile ──────────────────────────────────
      - name: Install Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_PATH"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH/DurakOnlineKZ_AppStore.mobileprovision"
          echo "Provisioning profile installed"

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH/DurakOnlineKZ_AppStore.mobileprovision" -o /tmp/profile.plist 2>/dev/null && \
            /usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist 2>/dev/null | tr -d '\n' || echo "")
          if [ -z "$PROFILE_UUID" ]; then
            PROFILE_UUID=$(grep -a 'UUID' "$PROFILE_PATH/DurakOnlineKZ_AppStore.mobileprovision" | \
              grep -o '[0-9a-f]\{8\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{4\}-[0-9a-f]\{12\}' | head -1)
          fi
          echo "Profile UUID: $PROFILE_UUID"
          printf 'PROFILE_UUID=%s\n' "$PROFILE_UUID" >> $GITHUB_ENV

      # ── 14. Update Xcode project settings ─────────────────────────────────
      - name: Update Xcode project bundle ID and signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          cd ios/App

          python3 << 'PYEOF'
          import re, os

          pbxproj_path = "App.xcodeproj/project.pbxproj"
          bundle_id = os.environ["IOS_BUNDLE_ID"]
          team_id = os.environ["IOS_TEAM_ID"]

          with open(pbxproj_path, "r") as f:
              content = f.read()

          content = re.sub(
              r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
              f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};',
              content
          )
          content = re.sub(
              r'DEVELOPMENT_TEAM = [^;]*;',
              f'DEVELOPMENT_TEAM = {team_id};',
              content
          )
          content = re.sub(
              r'CODE_SIGN_STYLE = [^;]+;',
              'CODE_SIGN_STYLE = Manual;',
              content
          )
          content = re.sub(
              r'CODE_SIGN_IDENTITY = [^;]*;',
              'CODE_SIGN_IDENTITY = "Apple Distribution";',
              content
          )
          content = re.sub(
              r'\s*PROVISIONING_PROFILE_SPECIFIER = [^;]*;',
              '',
              content
          )

          profile_name = "DurakOnlineKZ AppStore Distribution"
          lines = content.split('\n')
          result = []
          for line in lines:
              result.append(line)
              if f'PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};' in line:
                  result.append(f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";')
          content = '\n'.join(result)

          with open(pbxproj_path, "w") as f:
              f.write(content)

          print("Xcode project updated successfully")
          PYEOF

          find Pods -name "*.xcconfig" 2>/dev/null | while read xcconfig; do
            sed -i '' '/^CODE_SIGN_IDENTITY/d' "$xcconfig" 2>/dev/null || true
            sed -i '' '/^PROVISIONING_PROFILE/d' "$xcconfig" 2>/dev/null || true
          done
          echo "Pods xcconfig files patched"

          echo "Pre-resolving SPM packages..."
          xcodebuild -resolvePackageDependencies \
            -workspace App.xcworkspace \
            -scheme App \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            2>&1 | tail -5 || true

          echo "Xcode project updated"

      # ── 15. Build & Archive ────────────────────────────────────────────
      - name: Build and Archive
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          export PATH="/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:$PATH"
          cd ios/App

          # Install xcpretty if not present (via gem user install)
          if ! command -v xcpretty &>/dev/null; then
            gem install xcpretty --no-document --user-install 2>/dev/null || true
            export PATH="$HOME/.gem/ruby/2.6.0/bin:$PATH"
          fi

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            2>&1 | tee /tmp/xcodebuild.log | (xcpretty --color 2>/dev/null || cat)

          if [ ! -d "$RUNNER_TEMP/App.xcarchive" ]; then
            echo "Archive failed! Last 100 lines of build log:"
            tail -100 /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive created successfully!"

      # ── 16. Export IPA ──────────────────────────────────────────────────────
      - name: Export IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          # Write ExportOptions.plist using python3 to avoid heredoc YAML issues
          python3 - << 'PYEOF'
          import os
          team_id = os.environ['IOS_TEAM_ID']
          bundle_id = os.environ['IOS_BUNDLE_ID']
          runner_temp = os.environ['RUNNER_TEMP']
          plist = (
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0">\n'
              '<dict>\n'
              '  <key>method</key>\n'
              '  <string>app-store-connect</string>\n'
              '  <key>teamID</key>\n'
              '  <string>' + team_id + '</string>\n'
              '  <key>uploadBitcode</key>\n'
              '  <false/>\n'
              '  <key>uploadSymbols</key>\n'
              '  <true/>\n'
              '  <key>signingStyle</key>\n'
              '  <string>manual</string>\n'
              '  <key>provisioningProfiles</key>\n'
              '  <dict>\n'
              '    <key>' + bundle_id + '</key>\n'
              '    <string>DurakOnlineKZ AppStore Distribution</string>\n'
              '  </dict>\n'
              '</dict>\n'
              '</plist>\n'
          )
          with open(runner_temp + '/ExportOptions.plist', 'w') as f:
              f.write(plist)
          print('ExportOptions.plist created')
          PYEOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          echo "IPA exported:"
          ls -la "$RUNNER_TEMP/ipa/"

      # ── 17. Upload to App Store Connect ─────────────────────────────────────
      - name: Upload to App Store Connect
        if: ${{ github.event.inputs.upload_to_appstore != 'false' }}
        env:
          APPLE_ID: "brbpubg@gmail.com"
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/ipa" -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --verbose || \
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "@env:APPLE_APP_SPECIFIC_PASSWORD" \
            --verbose

      # ── 18. Upload IPA as artifact (always) ─────────────────────────────────
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakOnlineKZ-iOS-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      # ── 19. Cleanup keychain ─────────────────────────────────────────────────────
      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
