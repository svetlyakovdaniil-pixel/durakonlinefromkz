name: Build iOS & Upload to TestFlight

# Triggers:
#   - Push a git tag like "v1.2.3" → full build + TestFlight upload
#   - Manual trigger via GitHub UI (Actions → Run workflow)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to TestFlight after build?'
        required: false
        default: 'true'
        type: boolean

jobs:
  build_ios:
    name: Build & Upload iOS
    runs-on: macos-15          # macOS 15 Sequoia — Xcode 16 pre-installed
    timeout-minutes: 60

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install Node dependencies ─────────────────────────────────────────
      - name: Install Node dependencies
        run: npm ci

      # ── 4. Build web app ─────────────────────────────────────────────────────
      - name: Build web app
        run: npm run build
        env:
          # Pass all required env vars for the build
          VITE_APP_ID:                    ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL:          ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          VITE_ADMOB_IOS_APP_ID:          ${{ secrets.VITE_ADMOB_IOS_APP_ID }}
          VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID }}
          VITE_REVENUECAT_IOS_KEY:        ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_FRONTEND_FORGE_API_KEY:    ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_URL:    ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}

      # ── 5. Download bundled card & table assets ──────────────────────────────
      # Assets are stored in Manus S3 and served via /manus-storage/ proxy.
      # In the mobile build we download them directly into dist/public so
      # they are bundled inside the .ipa (no network needed at runtime).
      - name: Download card & table assets into dist/public
        run: |
          mkdir -p dist/public/manus-storage
          python3 scripts/download_assets_ci.py
        env:
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}

      # ── 6. Add Capacitor iOS platform ────────────────────────────────────────
      - name: Add Capacitor iOS platform
        run: npx cap add ios

      # ── 7. Restore GoogleService-Info.plist ──────────────────────────────────
      - name: Restore GoogleService-Info.plist
        run: |
          cp ios/App/App/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          # The file is already in git; this step is a no-op but kept for clarity.

      # ── 8. Sync Capacitor (copies dist/public into iOS project) ─────────────
      - name: Sync Capacitor
        run: npx cap sync ios

      # ── 9. Cache CocoaPods ───────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ── 10. Install CocoaPods ────────────────────────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      # ── 11. Set up Ruby + Fastlane ───────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true   # runs `bundle install` automatically

      # ── 12. Run Fastlane beta lane ───────────────────────────────────────────
      - name: Run Fastlane beta
        uses: maierj/fastlane-action@v3.1.0
        env:
          BUNDLE_IDENTIFIER:              ${{ secrets.BUNDLE_IDENTIFIER }}
          APP_STORE_CONNECT_TEAM_ID:      ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APPLE_ID:                       ${{ secrets.APPLE_ID }}
          APPLE_KEY_ID:                   ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID:                ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT:              ${{ secrets.APPLE_KEY_CONTENT }}
          BUILD_CERTIFICATE_BASE64:       ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD:                   ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_PROFILE_NAME:             ${{ secrets.APPLE_PROFILE_NAME }}
        with:
          lane: ios beta

      # ── 13. Upload .ipa as artifact (always, even on failure) ────────────────
      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakKZ-${{ github.ref_name }}.ipa
          path: ./DurakKZ.ipa
          retention-days: 14

      # ── 14. Upload build logs on failure ─────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: ./build_logs/
          retention-days: 7
