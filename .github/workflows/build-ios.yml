name: Build iOS & Upload to TestFlight

# Triggers:
#   - Push a git tag like "v1.2.3" → full build + TestFlight upload
#   - Manual trigger via GitHub UI (Actions → Run workflow)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to TestFlight after build?'
        required: false
        default: 'true'
        type: boolean

jobs:
  build_ios:
    name: Build & Upload iOS
    runs-on: macos-15          # macOS 15 Sequoia — Xcode 16 pre-installed
    timeout-minutes: 90

    steps:
      # ── 1. Checkout source code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js 22 ─────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 3. Set up pnpm ───────────────────────────────────────────────────────
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # ── 4. Get pnpm store directory ──────────────────────────────────────────
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      # ── 5. Cache pnpm store ──────────────────────────────────────────────────
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # ── 6. Install Node dependencies ─────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── 7. Build web app ─────────────────────────────────────────────────────
      - name: Build web app
        run: pnpm run build
        env:
          VITE_APP_ID:                    ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL:          ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          VITE_ADMOB_IOS_APP_ID:          ${{ secrets.VITE_ADMOB_IOS_APP_ID }}
          VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID }}
          VITE_REVENUECAT_IOS_KEY:        ${{ secrets.VITE_REVENUECAT_IOS_KEY }}
          VITE_FRONTEND_FORGE_API_KEY:    ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_URL:    ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}

      # ── 8. Download bundled card & table assets ──────────────────────────────
      # Assets are stored in Manus S3 and served via /manus-storage/ proxy.
      # In the mobile build we download them directly into dist/public so
      # they are bundled inside the .ipa (no network needed at runtime).
      - name: Download card & table assets into dist/public
        run: |
          mkdir -p dist/public/manus-storage
          python3 scripts/download_assets_ci.py
        env:
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}

      # ── 9. Add Capacitor iOS platform ────────────────────────────────────────
      - name: Add Capacitor iOS platform
        run: npx cap add ios

      # ── 10. Restore GoogleService-Info.plist ─────────────────────────────────
      # The file is already committed in ios/App/App/ — no action needed.
      # This step is kept as a reminder and for clarity.
      - name: Verify GoogleService-Info.plist
        run: |
          if [ ! -f "ios/App/App/GoogleService-Info.plist" ]; then
            echo "ERROR: GoogleService-Info.plist not found!"
            exit 1
          fi
          echo "GoogleService-Info.plist found ✓"

      # ── 11. Update Info.plist with production AdMob App ID from secrets ────────
      # Info.plist is committed in git with a placeholder AdMob ID.
      # Here we overwrite it with the real production ID from GitHub Secrets.
      - name: Update Info.plist AdMob App ID
        run: |
          INFO_PLIST="ios/App/App/Info.plist"
          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist not found at $INFO_PLIST"
            exit 1
          fi

          # Update GADApplicationIdentifier with the real production AdMob App ID
          /usr/libexec/PlistBuddy -c \
            "Set :GADApplicationIdentifier $VITE_ADMOB_IOS_APP_ID" \
            "$INFO_PLIST"

          echo "Info.plist AdMob ID updated ✓"
          /usr/libexec/PlistBuddy -c "Print :GADApplicationIdentifier" "$INFO_PLIST"
        env:
          VITE_ADMOB_IOS_APP_ID: ${{ secrets.VITE_ADMOB_IOS_APP_ID }}

      # ── 12. Sync Capacitor (copies dist/public into iOS project) ─────────────
      - name: Sync Capacitor
        run: npx cap sync ios

      # ── 13. Cache CocoaPods ──────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/App/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/App/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # ── 14. Install CocoaPods ────────────────────────────────────────────────
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      # ── 15. Set up Ruby + Fastlane ───────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true   # runs `bundle install` automatically

      # ── 16. Run Fastlane beta lane ───────────────────────────────────────────
      - name: Run Fastlane beta
        uses: maierj/fastlane-action@v3.1.0
        env:
          BUNDLE_IDENTIFIER:              ${{ secrets.BUNDLE_IDENTIFIER }}
          APP_STORE_CONNECT_TEAM_ID:      ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          APPLE_ID:                       ${{ secrets.APPLE_ID }}
          APPLE_KEY_ID:                   ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID:                ${{ secrets.APPLE_ISSUER_ID }}
          APPLE_KEY_CONTENT:              ${{ secrets.APPLE_KEY_CONTENT }}
          BUILD_CERTIFICATE_BASE64:       ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD:                   ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          APPLE_PROFILE_NAME:             ${{ secrets.APPLE_PROFILE_NAME }}
        with:
          lane: ios beta

      # ── 17. Upload .ipa as artifact (always, even on failure) ────────────────
      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DurakKZ-${{ github.ref_name }}.ipa
          path: ./DurakKZ.ipa
          retention-days: 14

      # ── 18. Upload build logs on failure ─────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.ref_name }}
          path: ./build_logs/
          retention-days: 7
