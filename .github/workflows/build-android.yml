name: Build Android & Upload to Google Play

# Triggers:
#   - Push a git tag like "v1.2.3" → full build + Play Store upload
#   - Manual trigger via GitHub UI (Actions → Run workflow)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: 'Upload to Google Play (Internal Testing) after build?'
        required: false
        default: 'true'
        type: boolean

jobs:
  build_android:
    name: Build & Upload Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # ── 4. Set up Java ───────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 5. Build web assets ──────────────────────────────────────────────────
      - name: Build web app
        env:
          VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
          VITE_OAUTH_PORTAL_URL: ${{ secrets.VITE_OAUTH_PORTAL_URL }}
          VITE_ADMOB_ANDROID_APP_ID: ${{ secrets.VITE_ADMOB_ANDROID_APP_ID }}
          VITE_ADMOB_REWARDED_AD_UNIT_ID: ${{ secrets.VITE_ADMOB_REWARDED_AD_UNIT_ID }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
          VITE_FRONTEND_FORGE_API_KEY: ${{ secrets.VITE_FRONTEND_FORGE_API_KEY }}
          VITE_FRONTEND_FORGE_API_URL: ${{ secrets.VITE_FRONTEND_FORGE_API_URL }}
        run: pnpm run build

      # ── 6. Download card/table assets ────────────────────────────────────────
      - name: Download card and table assets
        env:
          BUILT_IN_FORGE_API_URL: ${{ secrets.BUILT_IN_FORGE_API_URL }}
          BUILT_IN_FORGE_API_KEY: ${{ secrets.BUILT_IN_FORGE_API_KEY }}
        run: |
          # The script downloads to dist/public/manus-storage/ by default
          # After build, we copy them to the Android assets directory
          mkdir -p android/app/src/main/assets/public/assets/static
          python3 scripts/download_assets_ci.py
          # Copy downloaded assets to Android bundle directory
          cp dist/public/manus-storage/* android/app/src/main/assets/public/assets/static/ 2>/dev/null || true

      # ── 7. Sync Capacitor ────────────────────────────────────────────────────
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── 8. Decode keystore ───────────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/durak-kz-release.jks

      # ── 9. Build signed AAB ──────────────────────────────────────────────────
      - name: Build release AAB
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=../android/app/durak-kz-release.jks \
            -Pandroid.injected.signing.store.password=$ANDROID_STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=durak-kz \
            -Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD

      # ── 10. Upload artifact ──────────────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 11. Upload to Google Play (Internal Testing) ─────────────────────────
      - name: Upload to Google Play Internal Testing
        if: ${{ github.event.inputs.upload_to_play != 'false' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: online.durakonline.fromkz
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: ${{ github.ref_name }}
