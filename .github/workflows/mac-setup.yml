name: Mac Runner Setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - name: System Info
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo "=== Current PATH ==="
          echo $PATH
          echo "=== Available tools ==="
          which brew 2>/dev/null || echo "brew: not in PATH"
          which ruby 2>/dev/null && ruby --version
          which gem 2>/dev/null && gem --version
          which pod 2>/dev/null && pod --version || echo "pod: not found"
          which fastlane 2>/dev/null && fastlane --version || echo "fastlane: not found"

      - name: Find and setup Xcode
        run: |
          echo "=== Searching for Xcode ==="
          XCODE_PATH=""
          
          # Check /Applications first
          for app in /Applications/Xcode*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              XCODE_PATH="$app"
              echo "Found in /Applications: $XCODE_PATH"
              break
            fi
          done
          
          # Check Downloads
          if [ -z "$XCODE_PATH" ]; then
            for app in /Users/*/Downloads/Xcode*.app /Users/*/Downloads/Xcode.app; do
              if [ -d "$app" ]; then
                XCODE_PATH="$app"
                echo "Found in Downloads: $XCODE_PATH"
                break
              fi
            done
          fi
          
          # Check Desktop
          if [ -z "$XCODE_PATH" ]; then
            for app in /Users/*/Desktop/Xcode*.app; do
              if [ -d "$app" ]; then
                XCODE_PATH="$app"
                echo "Found on Desktop: $XCODE_PATH"
                break
              fi
            done
          fi
          
          if [ -z "$XCODE_PATH" ]; then
            echo "ERROR: Xcode not found anywhere!"
            exit 1
          fi
          
          # Move to /Applications if not already there
          if [[ "$XCODE_PATH" != /Applications/* ]]; then
            echo "Moving $XCODE_PATH to /Applications/Xcode.app..."
            sudo mv "$XCODE_PATH" /Applications/Xcode.app
            XCODE_PATH="/Applications/Xcode.app"
          fi
          
          echo "Using Xcode at: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Accept Xcode license ==="
          sudo xcodebuild -license accept || echo "License already accepted"

      - name: Install Homebrew if needed
        run: |
          # Try to find brew in common locations
          BREW_PATH=""
          for p in /opt/homebrew/bin/brew /usr/local/bin/brew /home/linuxbrew/.linuxbrew/bin/brew; do
            if [ -f "$p" ]; then
              BREW_PATH="$p"
              break
            fi
          done
          
          if [ -n "$BREW_PATH" ]; then
            eval "$($BREW_PATH shellenv)"
            echo "Homebrew already installed: $(brew --version | head -1)"
          else
            echo "Installing Homebrew..."
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
            # Add to PATH for Apple Silicon
            if [ -f /opt/homebrew/bin/brew ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
            elif [ -f /usr/local/bin/brew ]; then
              eval "$(/usr/local/bin/brew shellenv)"
            fi
            echo "Homebrew installed: $(brew --version | head -1)"
          fi

      - name: Install CocoaPods via Homebrew
        run: |
          # Setup brew PATH
          for p in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -f "$p" ]; then
              eval "$($p shellenv)"
              break
            fi
          done
          
          echo "=== Checking CocoaPods ==="
          if command -v pod &>/dev/null; then
            echo "CocoaPods already installed: $(pod --version)"
          else
            echo "Installing CocoaPods via brew..."
            brew install cocoapods
            echo "CocoaPods installed: $(pod --version)"
          fi

      - name: Install Fastlane via Homebrew
        run: |
          # Setup brew PATH
          for p in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -f "$p" ]; then
              eval "$($p shellenv)"
              break
            fi
          done
          
          echo "=== Checking Fastlane ==="
          if command -v fastlane &>/dev/null; then
            echo "Fastlane already installed: $(fastlane --version | head -1)"
          else
            echo "Installing Fastlane via brew..."
            brew install fastlane
            echo "Fastlane installed: $(fastlane --version | head -1)"
          fi

      - name: Verify all tools
        run: |
          # Setup brew PATH
          for p in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -f "$p" ]; then
              eval "$($p shellenv)"
              break
            fi
          done
          
          echo "=== Final verification ==="
          echo "Xcode:"
          xcodebuild -version
          echo ""
          echo "Ruby:"
          ruby --version
          echo ""
          echo "CocoaPods:"
          pod --version || echo "pod not found"
          echo ""
          echo "Fastlane:"
          fastlane --version | head -2 || echo "fastlane not found"
          echo ""
          echo "=== Brew prefix ==="
          brew --prefix
          echo ""
          echo "=== PATH ==="
          echo $PATH

      - name: Setup complete
        run: |
          # Setup brew PATH
          for p in /opt/homebrew/bin/brew /usr/local/bin/brew; do
            if [ -f "$p" ]; then
              eval "$($p shellenv)"
              break
            fi
          done
          
          echo "✅ Mac runner setup complete!"
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "CocoaPods: $(pod --version 2>/dev/null || echo 'not found')"
          echo "Fastlane: $(fastlane --version 2>/dev/null | head -1 || echo 'not found')"
          echo ""
          echo "=== Add to your iOS build workflow ==="
          BREW_PREFIX=$(brew --prefix)
          echo "export PATH=\"$BREW_PREFIX/bin:\$PATH\""
