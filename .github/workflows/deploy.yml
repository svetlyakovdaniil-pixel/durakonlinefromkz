name: Deploy to Aeza

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 185.221.199.177
          username: root
          key: ${{ secrets.AEZA_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/app
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm run build
            # Restore static assets (images, audio) that are served locally
            # These files are stored in /root/static_assets/ and survive deploys
            if [ -d /root/static_assets ]; then
              cp -r /root/static_assets/. /root/app/dist/public/assets/static/
              echo "Static assets restored: $(ls /root/static_assets | wc -l) files"
            fi
            pm2 restart durak
            echo "Deploy completed at $(date)"
