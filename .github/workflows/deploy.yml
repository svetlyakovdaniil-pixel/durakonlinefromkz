name: Deploy to FirstVDS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 176.12.79.38
          username: root
          password: ${{ secrets.FIRSTVDS_SSH_PASSWORD }}
          script: |
            set -e
            git config --global --add safe.directory /root/app
            cd /root/app
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm run build
            # Update "Dark trap electronic" -> "House" playlist (rename + new tracks)
            set +e
            npx tsx scripts/update_house_playlist.ts
            UPDATE_STATUS=$?
            set -e
            if [ $UPDATE_STATUS -ne 0 ]; then
              echo "WARNING: House playlist update failed (will retry next deploy)"
            fi
            GHOST_PLAYER_COUNT=100 pm2 restart durak --update-env
            pm2 save
            echo "Deploy completed at $(date)"
