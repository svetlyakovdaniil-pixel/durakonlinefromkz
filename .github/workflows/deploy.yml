name: Deploy to FirstVDS
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 176.12.79.38
          username: root
          password: ${{ secrets.FIRSTVDS_SSH_PASSWORD }}
          script: |
            set -e
            cd /root/app
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm run build
            GHOST_PLAYER_COUNT=100 pm2 restart durak --update-env
            echo "Deploy completed at $(date)"
