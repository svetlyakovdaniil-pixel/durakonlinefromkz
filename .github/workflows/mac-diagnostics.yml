name: Mac Runner Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check Mac Runner Environment
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: System Info
        run: |
          echo "=== USER ==="
          whoami
          echo "=== HOME ==="
          echo $HOME
          echo "=== macOS version ==="
          sw_vers
          echo "=== Architecture ==="
          uname -m

      - name: Find Xcode everywhere
        run: |
          echo "=== xcode-select path ==="
          xcode-select -p 2>/dev/null || echo "xcode-select failed"
          echo "=== xcodebuild version ==="
          xcodebuild -version 2>&1 || echo "xcodebuild failed"
          echo "=== /Applications contents ==="
          ls /Applications/ 2>/dev/null | head -30
          echo "=== Find Xcode.app anywhere ==="
          find / -name "Xcode.app" -maxdepth 5 2>/dev/null | head -10
          echo "=== Find xcodebuild binary ==="
          find / -name "xcodebuild" -maxdepth 10 2>/dev/null | head -10
          echo "=== /Volumes contents ==="
          ls /Volumes/ 2>/dev/null || echo "no /Volumes"
          echo "=== /Developer ==="
          ls /Developer/ 2>/dev/null || echo "no /Developer"

      - name: Find Homebrew everywhere
        run: |
          echo "=== brew in PATH ==="
          which brew 2>/dev/null && brew --version || echo "brew not in PATH"
          echo "=== Find brew binary ==="
          find /usr /opt /home $HOME 2>/dev/null -name "brew" -type f 2>/dev/null | head -20
          echo "=== /usr/local/bin contents ==="
          ls /usr/local/bin/ 2>/dev/null | head -30
          echo "=== /opt contents ==="
          ls /opt/ 2>/dev/null || echo "no /opt"
          echo "=== /opt/homebrew contents ==="
          ls /opt/homebrew/ 2>/dev/null || echo "no /opt/homebrew"
          echo "=== /opt/homebrew/bin contents ==="
          ls /opt/homebrew/bin/ 2>/dev/null | head -30 || echo "no /opt/homebrew/bin"

      - name: Ruby and CocoaPods
        run: |
          echo "=== System Ruby ==="
          /usr/bin/ruby --version 2>/dev/null || echo "No system ruby"
          echo "=== PATH ruby ==="
          which ruby 2>/dev/null && ruby --version || echo "No ruby in PATH"
          echo "=== rbenv ==="
          which rbenv 2>/dev/null && rbenv versions || echo "rbenv not found"
          echo "=== Find all ruby binaries ==="
          find /usr /opt $HOME 2>/dev/null -name "ruby" -type f 2>/dev/null | head -10
          echo "=== pod in PATH ==="
          which pod 2>/dev/null && pod --version || echo "pod not found in PATH"
          echo "=== Find pod binary ==="
          find /usr /opt $HOME 2>/dev/null -name "pod" -type f 2>/dev/null | head -10
          echo "=== gem list ==="
          /usr/bin/gem list 2>/dev/null | grep -E "cocoapods|fastlane" || echo "No cocoapods/fastlane in system gems"
          echo "=== User gem dir ==="
          ls $HOME/.gem/ 2>/dev/null || echo "no ~/.gem"
          ls $HOME/.gem/ruby/ 2>/dev/null || echo "no ~/.gem/ruby"
          echo "=== sudo gem install test (dry run) ==="
          sudo /usr/bin/gem list 2>/dev/null | grep cocoapods || echo "cocoapods not installed via sudo gem"

      - name: Fastlane
        run: |
          echo "=== fastlane in PATH ==="
          which fastlane 2>/dev/null && fastlane --version || echo "fastlane not found in PATH"
          echo "=== Find fastlane binary ==="
          find /usr /opt $HOME 2>/dev/null -name "fastlane" -type f 2>/dev/null | head -10

      - name: Node & pnpm
        run: |
          echo "=== Node ==="
          which node && node --version || echo "node not found"
          echo "=== pnpm ==="
          which pnpm && pnpm --version || echo "pnpm not found"

      - name: Full PATH
        run: |
          echo "=== Full PATH ==="
          echo $PATH | tr ':' '\n'
          echo "=== /etc/paths ==="
          cat /etc/paths 2>/dev/null || echo "no /etc/paths"
          echo "=== /etc/paths.d ==="
          ls /etc/paths.d/ 2>/dev/null && cat /etc/paths.d/* 2>/dev/null || echo "no /etc/paths.d"
          echo "=== ~/.zshrc ==="
          cat $HOME/.zshrc 2>/dev/null | head -30 || echo "no ~/.zshrc"
          echo "=== ~/.bash_profile ==="
          cat $HOME/.bash_profile 2>/dev/null | head -30 || echo "no ~/.bash_profile"
